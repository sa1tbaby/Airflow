version: "3"

vars:
  COMPOSE_BASE: -f deploy/docker/compose.yaml
  COMPOSE_CELERY: -f deploy/docker/compose.yaml -f deploy/docker/compose.celery.yaml
  DEPENDENCY_CUTOFF: "2024-04-05T23:59:59Z"
  HELM_CHART_VERSION: "1.13.1"

tasks:
  init:
    desc: Generate a local .env file on Ubuntu 22.04
    cmds:
      - sh scripts/init-env.sh

  build:
    desc: Build the shared Airflow runtime image
    preconditions:
      - sh: test -f .env
        msg: Run task init first or copy .env.example to .env.
    cmds:
      - docker compose --env-file .env {{.COMPOSE_BASE}} build

  up:
    desc: Start the compact LocalExecutor stack
    preconditions:
      - sh: test -f .env
        msg: Run task init first or copy .env.example to .env.
    cmds:
      - docker compose --env-file .env {{.COMPOSE_BASE}} up --build -d --wait

  up:celery:
    desc: Start the CeleryExecutor stack with Redis and a worker
    preconditions:
      - sh: test -f .env
        msg: Run task init first or copy .env.example to .env.
    cmds:
      - docker compose --env-file .env {{.COMPOSE_CELERY}} up --build -d --wait

  down:
    desc: Stop either Compose variant without deleting its data volume
    cmds:
      - docker compose --env-file .env {{.COMPOSE_CELERY}} down --remove-orphans

  logs:
    desc: Follow logs from all Airflow services
    cmds:
      - docker compose --env-file .env {{.COMPOSE_CELERY}} logs -f

  test:
    desc: Run lint and tests in the same image used by deployments
    cmds:
      - docker build --target test -t airflow-template:test .
      - docker run --rm airflow-template:test

  requirements:compile:
    desc: Regenerate the runtime and development Python lock files
    cmds:
      - >-
        uv pip compile --python-version 3.11.8
        --python-platform x86_64-manylinux_2_17
        --exclude-newer {{.DEPENDENCY_CUTOFF}}
        --output-file requirements.txt requirements.in
      - >-
        uv pip compile --python-version 3.11.8
        --python-platform x86_64-manylinux_2_17
        --exclude-newer {{.DEPENDENCY_CUTOFF}}
        --output-file requirements-dev.txt requirements-dev.in

  compose:check:
    desc: Validate both merged Compose configurations
    cmds:
      - docker compose --env-file .env {{.COMPOSE_BASE}} config --quiet
      - docker compose --env-file .env {{.COMPOSE_CELERY}} config --quiet

  helm:template:kubernetes:
    desc: Render the KubernetesExecutor Helm release locally
    cmds:
      - >-
        helm template airflow apache-airflow/airflow
        --version {{.HELM_CHART_VERSION}}
        --namespace airflow
        -f deploy/kubernetes/values/common.yaml
        -f deploy/kubernetes/values/kubernetes-executor.yaml
        -f deploy/kubernetes/values/dev.yaml

  helm:template:celery:
    desc: Render the CeleryExecutor Helm release locally
    cmds:
      - >-
        helm template airflow apache-airflow/airflow
        --version {{.HELM_CHART_VERSION}}
        --namespace airflow
        -f deploy/kubernetes/values/common.yaml
        -f deploy/kubernetes/values/celery-executor.yaml
        -f deploy/kubernetes/values/dev.yaml

