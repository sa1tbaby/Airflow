# Local kind/minikube profile. Never use these credentials in a shared cluster.
postgresql:
  enabled: true
  image:
    # Bitnami archives historical immutable tags in the bitnamilegacy repository.
    repository: bitnamilegacy/postgresql
    tag: 16.1.0-debian-11-r15
    digest: sha256:29e3dd0e7e7a740eabdbae6f82673507d180701a719bbdb6d6308a58cf723e64

redis:
  serviceAccount:
    automountServiceAccountToken: false
  persistence:
    enabled: false

# CeleryExecutor falls back to the chart-managed Redis in dev. This clears the
# external broker Secret selected by the Celery executor layer.
data:
  brokerUrlSecretName: null

pgbouncer:
  enabled: false

webserver:
  defaultUser:
    enabled: true
    role: Admin
    username: admin
    email: admin@example.com
    firstName: Airflow
    lastName: Admin
    password: admin
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

scheduler:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

dagProcessor:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

triggerer:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 512Mi

statsd:
  enabled: false
