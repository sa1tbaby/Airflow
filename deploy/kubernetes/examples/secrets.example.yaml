# Tracked template only. Render it with `sh scripts/init-env.sh`.
# The generated `.generated/kubernetes/secrets.yaml` contains plaintext secrets and is ignored.
apiVersion: v1
kind: Secret
metadata:
  name: airflow-metadata
  namespace: "{{yaml:K8S_NAMESPACE}}"
type: Opaque
stringData:
  connection: "{{yaml:K8S_METADATA_CONNECTION}}"
---
apiVersion: v1
kind: Secret
metadata:
  name: airflow-fernet-key
  namespace: "{{yaml:K8S_NAMESPACE}}"
type: Opaque
stringData:
  fernet-key: "{{yaml:K8S_FERNET_KEY}}"
---
apiVersion: v1
kind: Secret
metadata:
  name: airflow-webserver-secret
  namespace: "{{yaml:K8S_NAMESPACE}}"
type: Opaque
stringData:
  webserver-secret-key: "{{yaml:K8S_WEBSERVER_SECRET_KEY}}"
