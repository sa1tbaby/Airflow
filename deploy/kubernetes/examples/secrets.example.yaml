# EXAMPLE ONLY — every value below is intentionally invalid or non-secret.
# Do not commit a filled copy. Prefer External Secrets, Sealed Secrets, or SOPS.
apiVersion: v1
kind: Secret
metadata:
  name: airflow-metadata
  namespace: airflow
type: Opaque
stringData:
  connection: "postgresql+psycopg2://REPLACE_ME_USER:REPLACE_ME_PASSWORD@REPLACE_ME_DB_HOST:5432/airflow?sslmode=require"
---
# Required only by CeleryExecutor. RabbitMQ is also supported.
apiVersion: v1
kind: Secret
metadata:
  name: airflow-broker-url
  namespace: airflow
type: Opaque
stringData:
  connection: "redis://:REPLACE_ME_PASSWORD@REPLACE_ME_REDIS_HOST:6379/0"
---
# Generate with: python3 -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
apiVersion: v1
kind: Secret
metadata:
  name: airflow-fernet-key
  namespace: airflow
type: Opaque
stringData:
  fernet-key: "REPLACE_ME_WITH_A_VALID_FERNET_KEY"
---
# Generate with: python3 -c "import secrets; print(secrets.token_hex(16))"
apiVersion: v1
kind: Secret
metadata:
  name: airflow-webserver-secret
  namespace: airflow
type: Opaque
stringData:
  webserver-secret-key: "REPLACE_ME_WITH_A_RANDOM_WEBSERVER_SECRET"
