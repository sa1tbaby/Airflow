x-airflow-celery-environment: &airflow-celery-environment
  AIRFLOW__CORE__EXECUTOR: CeleryExecutor
  AIRFLOW__CORE__AUTH_MANAGER: airflow.auth.managers.fab.fab_auth_manager.FabAuthManager
  AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: ${AIRFLOW_DAGS_PAUSED_AT_CREATION:-true}
  AIRFLOW__CORE__LOAD_EXAMPLES: ${AIRFLOW_LOAD_EXAMPLES:-false}
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-airflow}@postgres:5432/${POSTGRES_DB:-airflow}"
  AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
  AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET_KEY:-local-development-webserver-secret-change-me}
  AIRFLOW__CORE__FERNET_KEY: ${FERNET_KEY:-}
  AIRFLOW__LOGGING__LOGGING_LEVEL: ${AIRFLOW_LOG_LEVEL:-INFO}
  AIRFLOW__CELERY__WORKER_CONCURRENCY: ${AIRFLOW_WORKER_CONCURRENCY:-2}
  AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
  AIRFLOW__CELERY__BROKER_URL: redis://redis:6379/0
  AIRFLOW__CELERY__RESULT_BACKEND: "db+postgresql://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-airflow}@postgres:5432/${POSTGRES_DB:-airflow}"

x-airflow-celery-common: &airflow-celery-common
  image: ${AIRFLOW_IMAGE_NAME:-airflow-template:2.8.4-python3.11}
  build:
    context: ../..
    dockerfile: Dockerfile
    target: runtime
    args:
      AIRFLOW_VERSION: ${AIRFLOW_VERSION:-2.8.4}
      PYTHON_VERSION: ${PYTHON_VERSION:-3.11}
  env_file:
    - ../../.env
  environment: *airflow-celery-environment
  user: "${AIRFLOW_UID:-50000}:0"
  volumes:
    - ../../dags:/opt/airflow/dags
    - ../../src:/opt/airflow/src
    - ../../include:/opt/airflow/include
    - ../../plugins:/opt/airflow/plugins
    - ../../logs:/opt/airflow/logs
  restart: unless-stopped

services:
  redis:
    image: redis:7.2.4-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  airflow-init:
    environment: *airflow-celery-environment
    depends_on:
      redis:
        condition: service_healthy

  airflow-webserver:
    environment: *airflow-celery-environment
    depends_on:
      redis:
        condition: service_healthy

  airflow-scheduler:
    environment: *airflow-celery-environment
    depends_on:
      redis:
        condition: service_healthy

  airflow-triggerer:
    environment: *airflow-celery-environment
    depends_on:
      redis:
        condition: service_healthy

  airflow-cli:
    environment: *airflow-celery-environment
    depends_on:
      redis:
        condition: service_healthy

  airflow-worker:
    <<: *airflow-celery-common
    command: celery worker
    environment:
      <<: *airflow-celery-environment
      DUMB_INIT_SETSID: "0"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          celery --app airflow.providers.celery.executors.celery_executor.app
          inspect ping -d "celery@$${HOSTNAME}"
          || celery --app airflow.executors.celery_executor.app
          inspect ping -d "celery@$${HOSTNAME}"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  flower:
    <<: *airflow-celery-common
    command: celery flower
    profiles: [flower]
    ports:
      - "${AIRFLOW_FLOWER_PORT:-5555}:5555"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:5555/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      redis:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
      airflow-worker:
        condition: service_healthy

volumes:
  redis-data:
