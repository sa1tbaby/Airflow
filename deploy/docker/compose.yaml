name: ${COMPOSE_PROJECT_NAME:-airflow-template}

x-airflow-common: &airflow-common
  image: ${AIRFLOW_IMAGE_NAME:-airflow-template:2.8.4-python3.11}
  build:
    context: ../..
    dockerfile: Dockerfile
    target: runtime
    args:
      AIRFLOW_VERSION: ${AIRFLOW_VERSION:-2.8.4}
      PYTHON_VERSION: ${PYTHON_VERSION:-3.11}
  env_file:
    - ../../.generated/docker/airflow.env
  environment: &airflow-common-environment
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.auth.managers.fab.fab_auth_manager.FabAuthManager
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: ${AIRFLOW_DAGS_PAUSED_AT_CREATION:-true}
    AIRFLOW__CORE__LOAD_EXAMPLES: ${AIRFLOW_LOAD_EXAMPLES:-false}
    AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
    AIRFLOW__LOGGING__LOGGING_LEVEL: ${AIRFLOW_LOG_LEVEL:-INFO}
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
  user: "${AIRFLOW_UID:-50000}:0"
  volumes:
    - ../../dags:/opt/airflow/dags
    - ../../src:/opt/airflow/src
    - ../../include:/opt/airflow/include
    - ../../plugins:/opt/airflow/plugins
    - ../../logs:/opt/airflow/logs
  restart: unless-stopped

services:
  postgres:
    image: postgres:13.14-bookworm
    env_file:
      - ../../.generated/docker/postgres.env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    env_file:
      - ../../.generated/docker/airflow.env
      - ../../.generated/docker/airflow-init.env
    entrypoint: /bin/bash
    command:
      - -c
      - |
        install -d -o "${AIRFLOW_UID:-50000}" -g 0 \
          /opt/airflow/dags \
          /opt/airflow/src \
          /opt/airflow/include \
          /opt/airflow/plugins \
          /opt/airflow/logs
        exec /entrypoint airflow version
    environment:
      <<: *airflow-common-environment
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
    user: "0:0"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "${AIRFLOW_WEBSERVER_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type TriggererJob --hostname \"$${HOSTNAME}\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-cli:
    <<: *airflow-common
    profiles: [debug]
    entrypoint: airflow
    command: info
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    restart: "no"

volumes:
  postgres-data:
